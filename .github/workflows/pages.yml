name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

# The deploy job mints a token for Pages; nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer push win rather than queue behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bun installs and runs scripts; Astro itself runs on Node, as its docs require.
      # Both versions come from package.json: packageManager and engines.node.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
